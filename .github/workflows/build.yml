name: Tag and Publish release

# This repo builds itself via its own flake (`nix build .#dist`, see test.yml).
# penguin consumes it as a flake input pinned to the tag this workflow cuts,
# building the binaries from source at that tag -- so this release is a
# version/provenance marker and publishes no binary asset.

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get next version
        uses: reecetech/version-increment@2023.10.1
        id: version
        with:
          use_api: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.v-version }}
          release_name: Release ${{ steps.version.outputs.v-version }} ${{ github.ref }}
          body: |
            Release ${{ steps.version.outputs.v-version }} @${{ github.ref }}

            Binaries are built and distributed by penguin-tools
            (penguin-tools.tar.gz); this release carries no binary asset.
          draft: true
          prerelease: false

      - name: Publish release
        uses: StuYarrow/publish-release@v1.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ steps.create_release.outputs.id }}
