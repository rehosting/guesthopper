name: Check that the code compiles

# Build guesthopper for every guest arch through this repo's OWN flake
# (`nix build .#dist` cross-builds all arches into the /igloo_static fragment
# penguin consumes). Self-contained -- no longer borrows penguin-tools'
# machinery. The Python host-client unit tests still run here.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: rehosting-arc
    env:
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
    steps:
      - uses: actions/checkout@v4

      - name: Test Python client
        run: python3 -m unittest discover -s tests

      - name: Prepare runner directories
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq xz-utils

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 8
            cores = 8

      - name: Configure Cachix
        uses: cachix/cachix-action@v16
        with:
          name: rehosting-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build guesthopper for all guest arches (this checkout)
        run: |
          set -eux
          nix build --accept-flake-config .#dist --no-link --print-out-paths -L
