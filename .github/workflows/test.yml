name: Check that the code compiles

# Build guesthopper for every guest arch through this repo's OWN flake
# (`nix build .#dist` cross-builds all arches into the /igloo_static fragment
# penguin consumes). Self-contained -- no longer borrows penguin-tools'
# machinery. The Python host-client unit tests still run here.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: rehosting-arc
    env:
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
    steps:
      - uses: actions/checkout@v4

      - name: Test Python client
        run: python3 -m unittest discover -s tests

      - name: Prepare runner directories
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq xz-utils

      # rehosting-arc pods ship a pre-installed multi-user Nix, so
      # install-nix-action can't re-install over the root-owned /nix store
      # ("Permission denied"). Use the pre-installed nix directly. The flake's
      # nixConfig (--accept-flake-config) supplies the rehosting-tools
      # substituter; NIX_CONFIG carries a GitHub token so flake-input fetches
      # don't hit the anonymous API rate limit.
      - name: Build guesthopper for all guest arches (this checkout)
        env:
          # Route store writes through the root-owned multi-user daemon (the
          # runner user can't write /nix/store directly).
          NIX_REMOTE: daemon
          NIX_CONFIG: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          for p in /nix/var/nix/profiles/default/bin "$HOME/.nix-profile/bin" \
                   /usr/local/bin /usr/bin; do
            if [ -x "$p/nix" ]; then export PATH="$p:$PATH"; break; fi
          done
          command -v nix || { echo "::error::no pre-installed nix on runner"; exit 1; }
          nix --version
          nix build --accept-flake-config .#dist --no-link --print-out-paths -L
