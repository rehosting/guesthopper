name: Test and build

# Two things, both through this repo's OWN flake (self-contained -- no
# penguin-tools machinery):
#
# 1. Run the tests natively on the runner (`nix develop -c tests/run_all.sh`):
#    the Rust agent tests, the Python client/gateway tests, and the scp/sftp
#    end-to-end tests against a stand-in agent. Nothing may skip -- a missing
#    prerequisite fails the job rather than quietly passing it.
# 2. Build guesthopper for every guest arch (`nix build .#dist` cross-builds
#    all arches into the /igloo_static fragment penguin consumes). Those builds
#    cannot run tests themselves: a guest binary is not host-runnable.

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: rehosting-arc
    env:
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner directories
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq xz-utils

      # Use the org-shared Nix setup (same as penguin's image build): pins a
      # modern Nix whose hashing matches the flake.lock and disables the KVM
      # setup that Arc pods lack a working udevd for.
      - name: Set up Nix
        uses: rehosting/ci/actions/nix-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-url: https://releases.nixos.org/nix/nix-2.31.2/install
          enable-kvm: false
          extra-nix-config: |
            max-jobs = 8
            cores = 8
          cache-backend: cachix
          cachix-name: rehosting-tools
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # cargo, OpenSSH's clients and Python+asyncssh all come from the flake's
      # dev shell, so nothing needs installing on the runner image.
      - name: Run all host tests (Rust, Python, scp/sftp end to end)
        run: nix develop --accept-flake-config -c tests/run_all.sh

      - name: Build guesthopper for all guest arches (this checkout)
        run: |
          set -eux
          nix build --accept-flake-config .#dist --no-link --print-out-paths -L
